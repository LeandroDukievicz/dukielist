[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dukielist"
version = "1.2.0"
description = "Cyberpunk terminal task manager built with Textual."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "textual>=8.2.8,<9",
    "google-api-python-client>=2,<3",
    "google-auth-oauthlib>=1,<2",
]

[project.scripts]
dukielist = "dukielist.app:main"

[tool.setuptools.packages.find]
include = ["dukielist*"]

[tool.setuptools.package-data]
dukielist = ["*.tcss"]
